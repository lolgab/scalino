id = "dotty-lsp-native"
name = "Dotty LSP Native"
description = "JVM-free Scala language server (dotty-lsp-native, from scala-native-compiler) -- diagnostics and hover without Metals' JVM dependency."
version = "0.2.0"
schema_version = 1
authors = ["Lorenzo Gabriele <lorenzo@codacy.com>"]
repository = "https://github.com/lolgab/snc"

# Defines the "Scala" language/grammar itself (languages/scala/, copied from
# metals-zed -- see languages/scala/NOTICE) instead of depending on the
# metals-zed extension for it. Zed has no extension-to-extension dependency
# mechanism and no way for one extension to disable another's language
# server, so reusing metals-zed's language would mean also installing its
# bundled JVM-backed `metals` server and manually excluding it in every
# project's settings.json. Owning the language here means installing only
# this extension is enough -- no Metals, no JVM, nothing to exclude.
[grammars.scala]
repository = "https://github.com/tree-sitter/tree-sitter-scala"
commit = "97aead18d97708190a51d4f551ea9b05b60641c9"

[language_servers.dotty-lsp-native]
name = "dotty-lsp-native"
language = "Scala"
