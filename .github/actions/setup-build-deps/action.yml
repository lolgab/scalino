name: Setup build dependencies
description: >
  Installs everything build/*.sh needs (Openjdk, coursier, sbt, clang), on Linux/macOS/Windows alike.

runs:
  using: composite
  steps:
    - name: Set up OpenJDK
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up coursier
      uses: coursier/setup-action@v1
      with:
        apps: cs sbt

    - name: Install clang (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -y
        # libzstd-dev provides libzstd.a (llvm-config's static libs omit it although LLVM_ENABLE_ZSTD
        # needs it) and pkg-config lets the build script find that .a instead of the neighbouring
        # libzstd.so. libtinfo-dev provides the libtinfo.so symlink for -ltinfo: libLLVMSupport.a calls
        # set_curterm/setupterm/tigetnum/del_curterm, which llvm-config --system-libs omits; the runner
        # only has the runtime libtinfo.so.6.
        #
        # Not the distro's clang/llvm-dev (Ubuntu 24.04: LLVM 18): apt.llvm.org gives a current LLVM,
        # matching macOS's `brew install llvm`. This matters since scalino-linkdriver links in
        # release-fast (docs/findings.md): its aggressive passes can trip version-specific AArch64
        # backend miscompiles, and linux-arm64 was the only leg on LLVM 18, consistent with a
        # linux-arm64-only release-fast GC segfault that a current-LLVM macOS-arm64 build of the same
        # commit didn't reproduce in 15/15 runs.
        wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
        chmod +x /tmp/llvm.sh
        # `all` also installs llvm-20-dev, which carries the per-component libLLVM*.a static archives.
        sudo /tmp/llvm.sh 20 all
        sudo apt-get install -y libzstd-dev libtinfo-dev pkg-config
        # /usr/lib/llvm-20/bin has the unversioned clang/clang++/llvm-config symlinks; put it ahead of
        # /usr/bin so `command -v clang` doesn't pick the distro clang.
        echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

    - name: Install llvm-config/libLLVM (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Xcode CLT ships clang/clang++ but not llvm-config/libLLVM. The direct LLVM-C codegen backend
        # (build/04-build-scalino-linkdriver.sh) links scalino-linkdriver statically against libLLVM
        # (+ zstd, a dependency of the llvm formula) so the released binary needs no LLVM at runtime.
        # pkg-config, used to find zstd's static .a, is preinstalled on the runners.
        brew install llvm
        echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

    - name: Locate clang (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # windows-latest images ship LLVM under this prefix; scala-native's C toolchain on Windows is
        # best-effort (docs/findings.md), this only makes clang/clang++ resolve.
        if ! command -v clang >/dev/null 2>&1; then
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
        fi
