name: VS Code extension

on:
  push:
    tags:
      - 'vscode-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the Marketplace (otherwise just build the .vsix)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "vscode-v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != package.json version $v" >&2
            exit 1
          fi

      - name: Package
        run: npx --yes @vscode/vsce package -o scalino-lsp.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: scalino-lsp-vsix
          path: vscode-extension/scalino-lsp.vsix

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/vscode-v') || inputs.publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath scalino-lsp.vsix

      - name: Publish to Open VSX
        if: (startsWith(github.ref, 'refs/tags/vscode-v') || inputs.publish) && env.OVSX_PAT != ''
        run: npx --yes ovsx publish scalino-lsp.vsix -p "$OVSX_PAT"
