name: VS Code extension

# Published by release.yml on every scalino release (v* tag), with the
# extension version set to the scalino version. Run by hand to build a
# .vsix, or to republish a version.
on:
  workflow_call:
    inputs:
      version:
        description: 'Extension version, e.g. 0.0.35 (a leading v is stripped)'
        type: string
        required: true
      publish:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Extension version, e.g. 0.0.35 (defaults to package.json)'
        type: string
        required: false
      publish:
        description: 'Publish to the Marketplace (otherwise just build the .vsix)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - run: npm ci

      - name: Set version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: npm version --no-git-tag-version --allow-same-version "${VERSION#v}"

      - name: Package
        run: npx --yes @vscode/vsce package -o scalino.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: scalino-vsix
          path: vscode-extension/scalino.vsix

      - name: Publish to VS Code Marketplace
        if: inputs.publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath scalino.vsix

      - name: Publish to Open VSX
        if: inputs.publish && env.OVSX_PAT != ''
        run: npx --yes ovsx publish scalino.vsix -p "$OVSX_PAT"
