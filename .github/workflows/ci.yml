name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The toolchain build is split so the two slowest links run side by side:
#
#   core  (00b..06: patched javalib/nativelib, scalino-linkdriver, dist/)
#     |-- dotc  (03, 03b, 07: scalino-dotc + the scalino CLI) + smoke tests
#     `-- lsp   (08: scalino-lsp; only needs core's output)
#           `-- finish (LSP smoke test, needs dist/scalino from dotc)
#
# core hands its working state to the other two as an artifact
# (build/ci-state.sh). release.yml still runs the whole thing as one job.
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          m='{"target":"linux-x86_64","os":"ubuntu-24.04"},{"target":"linux-arm64","os":"ubuntu-24.04-arm"},{"target":"macos-arm64","os":"macos-14"}'
          # The Intel Mac runner is by far the slowest (~80 min before the
          # split), so PRs skip it; pushes to main and manual runs keep it.
          if [[ "${{ github.event_name }}" != pull_request ]]; then
            m+=',{"target":"macos-x86_64","os":"macos-15-intel"}'
          fi
          # Windows x86_64 CI disabled -- see docs/findings.md.
          echo "matrix={\"include\":[$m]}" >> "$GITHUB_OUTPUT"

  core:
    name: core (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.os }}
    env:
      # Single link/codegen/clang worker: parallel clang on the 2-core runners
      # (plus the JVM heap) OOM-killed the runner. patch scala-native-0070.
      SCALANATIVE_LINK_THREADS: '1'
      # JVM heap for the link steps; the rest of RAM is needed by clang/LLVM
      # and the runner agent (80% on the 16 GB Linux runners got the runner
      # killed). macOS runners have less RAM and need the full 80%.
      SCALINO_LINK_RAM_PERCENT: ${{ startsWith(matrix.target, 'linux') && '55' || '80' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-deps

      - uses: ./.github/actions/memory-watchdog

      # The patched javalib/nativelib (01b/01c) take ~8 min to build on macOS
      # and only change with the scala-native patches, so keep what they
      # publish to ~/.ivy2/local.
      - name: Cache patched scala-native libs
        id: sn-cache
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/local/org.scala-native
          key: scalino-sn-published-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('patches/scala-native-*.patch', 'versions.env', 'build/01b-build-patched-javalib.sh', 'build/01c-build-patched-nativelib.sh') }}

      - name: Build toolchain (core)
        shell: bash
        env:
          SCALINO_REUSE_PUBLISHED: ${{ steps.sn-cache.outputs.cache-hit == 'true' && '1' || '' }}
        run: ./build/all.sh core

      - name: Memory log
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          tail -40 "$RUNNER_TEMP/mem.log" || true
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -10 || true

      - name: Save build state
        shell: bash
        run: ./build/ci-state.sh save "$RUNNER_TEMP/state.tgz"

      - uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.target }}
          path: ${{ runner.temp }}/state.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  lsp:
    name: lsp (${{ matrix.target }})
    needs: [plan, core]
    runs-on: ${{ matrix.os }}
    env:
      # Single link/codegen/clang worker: parallel clang on the 2-core runners
      # (plus the JVM heap) OOM-killed the runner. patch scala-native-0070.
      SCALANATIVE_LINK_THREADS: '1'
      SCALINO_LINK_RAM_PERCENT: ${{ startsWith(matrix.target, 'linux') && '55' || '80' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-deps

      - uses: ./.github/actions/memory-watchdog

      - uses: actions/download-artifact@v4
        with:
          name: state-${{ matrix.target }}
          path: ${{ runner.temp }}

      - name: Restore build state
        shell: bash
        run: ./build/ci-state.sh restore "$RUNNER_TEMP/state.tgz"

      - name: Build scalino-lsp
        shell: bash
        run: ./build/all.sh lsp

      - name: Memory log
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          tail -40 "$RUNNER_TEMP/mem.log" || true
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -10 || true

      # tar, not a bare path: artifact upload drops the executable bit.
      - name: Package scalino-lsp
        shell: bash
        run: tar -C dist -czf "$RUNNER_TEMP/scalino-lsp.tgz" scalino-lsp

      - uses: actions/upload-artifact@v4
        with:
          name: lsp-${{ matrix.target }}
          path: ${{ runner.temp }}/scalino-lsp.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  dotc:
    name: build (${{ matrix.target }})
    needs: [plan, core]
    runs-on: ${{ matrix.os }}
    env:
      # Single link/codegen/clang worker: parallel clang on the 2-core runners
      # (plus the JVM heap) OOM-killed the runner. patch scala-native-0070.
      SCALANATIVE_LINK_THREADS: '1'
      SCALINO_LINK_RAM_PERCENT: ${{ startsWith(matrix.target, 'linux') && '55' || '80' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-deps

      - uses: ./.github/actions/memory-watchdog

      - uses: actions/download-artifact@v4
        with:
          name: state-${{ matrix.target }}
          path: ${{ runner.temp }}

      - name: Restore build state
        shell: bash
        run: ./build/ci-state.sh restore "$RUNNER_TEMP/state.tgz"

      - name: Build toolchain (scalino-dotc, scalino)
        shell: bash
        run: ./build/all.sh dotc

      - name: Memory log
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          tail -40 "$RUNNER_TEMP/mem.log" || true
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -10 || true

      # Taken before the smoke tests so it is the freshly built dist/. tar,
      # not a bare path: artifact upload drops the executable bit.
      - name: Package dist
        shell: bash
        run: tar -C dist -czf "$RUNNER_TEMP/dist.tgz" .

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: ${{ runner.temp }}/dist.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Smoke test -- plain program
        shell: bash
        run: |
          out="$(./dist/scalino run examples/Hello.scala)"
          echo "$out"
          [[ "$out" == *"hello"* || "$out" == *"Hello"* ]] || { echo "unexpected output"; exit 1; }

      - name: Smoke test -- real macro
        # Known-failing, not a regression: examples/macro-hello/Test.scala
        # exercises jsoniter-scala's real derivation macro, which hits a
        # genuine, still-open interpreter gap (general quote-pattern
        # matching -- see docs/findings.md's "Remaining work" #1 and its
        # many "macro-hello still fails on its own pre-existing ... gap"
        # notes). Kept as a deliberate regression canary across sessions --
        # re-run here (continue-on-error, not skipped) so a change that
        # newly breaks it differently, or unexpectedly fixes it, still shows
        # up in the log even though it can't block CI on the known failure.
        continue-on-error: true
        shell: bash
        run: ./dist/scalino run examples/macro-hello/Test.scala examples/macro-hello/Foo.scala

      - name: Smoke test -- interpreter bug-fix regressions
        shell: bash
        run: ./dist/scalino run examples/interpreter-regressions/Test.scala examples/interpreter-regressions/Foo.scala

      - name: Smoke test -- stack-allocated objects (escape analysis)
        # Every release mode stack-allocates objects the escape analysis
        # proves non-escaping. SCALANATIVE_STACK_POISON overwrites a frame's
        # stack objects when it is left, so a wrong analysis crashes
        # deterministically instead of reading dead-but-intact stack memory.
        shell: bash
        run: |
          for mode in release-fast release-full; do
            ./dist/scalino clean   # earlier steps leave other entry points in .scalino-build
            out="$(SCALANATIVE_STACK_POISON=1 ./dist/scalino run examples/escape-analysis/Main.scala --main-class Main --native-mode "$mode")"
            echo "$mode: $out"
            [[ "$out" == *"sum=1412"* ]] || { echo "unexpected output"; exit 1; }
          done

      - name: Smoke test -- GC safepoint trampoline (patch 0069)
        # A thread stopped at a GC yield point must resume with every register,
        # the flags and the x86_64 red zone intact. The unit test checks the
        # trampoline directly (Linux x86_64 only); the example checks it end to
        # end: leaf loops that spill into the red zone while another thread
        # forces GCs.
        shell: bash
        run: |
          tests/safepoint-trampoline/run.sh
          ./dist/scalino clean
          out="$(./dist/scalino run examples/safepoint-trampoline/Main.scala --main-class Main --native-mode release-fast)"
          echo "$out"
          [[ "$out" == *"safepoint-trampoline: ok"* ]] || { echo "unexpected output"; exit 1; }

      - name: Smoke test -- dist/ is relocatable (flat, like a release tarball)
        shell: bash
        run: |
          # Mirrors release.yml's packaging: dist/'s *contents* copied flat
          # into an arbitrarily-named directory (no "dist/" wrapper) --
          # scalino must locate its own lib/, compiler.cp etc. as siblings of
          # itself, not by assuming a directory literally named "dist".
          pkg="$(mktemp -d)/scalino-smoketest"
          mkdir -p "$pkg"
          cp -a dist/. "$pkg/"
          workdir="$(mktemp -d)"
          cp examples/Hello.scala "$workdir/Hello.scala"
          ( cd "$workdir" && "$pkg/scalino" run Hello.scala )

      # Same flow as the scalino-example release workflow: one Linux host
      # cross-builds an app for every supported target, using the scalino
      # just built from this commit (so cross-compilation is tested before a
      # release, not by it).
      - name: Cache cross-compilation sysroots
        if: matrix.target == 'linux-x86_64'
        uses: actions/cache@v4
        with:
          path: ~/.cache/scalino/sysroots
          key: scalino-sysroots-${{ hashFiles('versions.env', 'cli/SysrootBuild.scala') }}

      - name: Cross-build -- every target from Linux
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          triples=(
            x86_64-unknown-linux-musl aarch64-unknown-linux-musl
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
            x86_64-apple-darwin aarch64-apple-darwin
            x86_64-pc-windows-gnu aarch64-pc-windows-gnu
          )
          command -v ld.lld  # needed for the macOS and Windows targets
          ./dist/scalino sysroot build "${triples[@]}"
          rm -rf cross-out
          # The Windows sysroot's libc++ needs clang >= 21; the toolchain
          # build above pins LLVM 20, so install a newer clang just for this.
          wget -O /tmp/llvm22.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm22.sh 22
          ./dist/scalino package examples/Hello.scala --native-mode release-fast \
            --native-clang /usr/lib/llvm-22/bin/clang --native-clangpp /usr/lib/llvm-22/bin/clang++ \
            --native-target-triple "$(IFS=,; echo "${triples[*]}")" \
            -o cross-out/hello
          ls -l cross-out
          check() { # <file> <pattern in `file` output>
            f="cross-out/$1"
            [[ -f "$f" ]] || { echo "missing $f"; exit 1; }
            desc="$(file "$f")"; echo "$desc"
            [[ "$desc" =~ $2 ]] || { echo "wrong format for $f"; exit 1; }
          }
          check hello-x86_64-unknown-linux-musl  'ELF 64-bit.*x86-64'
          check hello-aarch64-unknown-linux-musl 'ELF 64-bit.*aarch64'
          check hello-x86_64-unknown-linux-gnu   'ELF 64-bit.*x86-64'
          check hello-aarch64-unknown-linux-gnu  'ELF 64-bit.*aarch64'
          check hello-x86_64-apple-darwin        'Mach-O 64-bit.*x86_64'
          check hello-aarch64-apple-darwin       'Mach-O 64-bit.*arm64'
          check hello-x86_64-pc-windows-gnu.exe  'PE32\+.*x86-64'
          check hello-aarch64-pc-windows-gnu.exe 'PE32\+.*Aarch64'
          # The runner is x86_64 Linux: the two x86_64 Linux binaries must run.
          for t in musl gnu; do
            out="$(cross-out/hello-x86_64-unknown-linux-$t)"
            echo "$t: $out"
            [[ "$out" == *"ello"* ]] || { echo "unexpected output from $t binary"; exit 1; }
          done

  # scalino-lsp's smoke test drives it through `dist/scalino setup-ide`, so it
  # can only run once both the lsp and dotc jobs are done.
  finish:
    name: finish (${{ matrix.target }})
    needs: [plan, dotc, lsp]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-deps

      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: ${{ runner.temp }}

      - uses: actions/download-artifact@v4
        with:
          name: lsp-${{ matrix.target }}
          path: ${{ runner.temp }}

      - name: Assemble dist
        shell: bash
        run: |
          mkdir -p dist
          tar -C dist -xzf "$RUNNER_TEMP/dist.tgz"
          tar -C dist -xzf "$RUNNER_TEMP/scalino-lsp.tgz"

      - name: Smoke test -- scalino-lsp
        shell: bash
        run: ./build/08b-smoke-lsp.sh
