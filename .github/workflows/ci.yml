name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The toolchain build is split so the two slowest links run side by side:
#
#   core  (00b..06: patched javalib/nativelib, scalino-linkdriver, dist/)
#     |-- dotc  (03, 03b, 07, 04d: scalino-dotc, the scalino CLI, scalino-jslink) + smoke tests
#     |     `-- smoke (Scala.js, escape analysis, trampoline, cross-build; one job each)
#     `-- lsp   (08: scalino-lsp; only needs core's output)
#           `-- finish (LSP smoke test, needs dist/scalino from dotc)
#
# core hands its working state to the other two as an artifact
# (build/ci-state.sh). release.yml still runs the whole thing as one job.
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      smoke: ${{ steps.m.outputs.smoke }}
    steps:
      - id: m
        shell: bash
        run: |
          m='{"target":"linux-x86_64","os":"ubuntu-24.04"},{"target":"linux-arm64","os":"ubuntu-24.04-arm"},{"target":"macos-arm64","os":"macos-15"}'
          # The Intel Mac runner is by far the slowest (~80 min before the
          # split), so PRs skip it; pushes to main and manual runs keep it.
          if [[ "${{ github.event_name }}" != pull_request ]]; then
            m+=',{"target":"macos-x86_64","os":"macos-15-intel"}'
          fi
          echo "matrix={\"include\":[$m]}" >> "$GITHUB_OUTPUT"
          # One smoke job per (target, test); the cross-build runs on linux-x86_64 only.
          smoke="$(echo "{\"include\":[$m]}" | jq -c '{include: [.include[] as $e
            | ($e + {test: "js"}), ($e + {test: "escape"}), ($e + {test: "trampoline"}),
              (if $e.target == "linux-x86_64" then $e + {test: "cross"} else empty end)]}')"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"

  core:
    name: core (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.os }}
    env:
      # Single link/codegen/clang worker: parallel clang on the 2-core runners
      # (plus the JVM heap) OOM-killed the runner. patch scala-native-0070.
      SCALANATIVE_LINK_THREADS: '1'
      # JVM heap for the link steps; the rest of RAM is needed by clang/LLVM
      # and the runner agent (80% on the 16 GB Linux runners got the runner
      # killed). macOS runners have less RAM and need the full 80%.
      SCALINO_LINK_RAM_PERCENT: ${{ startsWith(matrix.target, 'linux') && '55' || '80' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # core's output (ci-state.sh's tarball) depends only on what build/all.sh's core stage reads, so a change
      # to none of it (the CLI, the tests, a workflow, the README, the LSP...) reuses the tarball instead of
      # rebuilding Scala Native, the compiler and the linkdriver (~20-40 min per target). The hash covers every
      # file those scripts read: versions.env, patches/, tools/ (the Scala.js IR checksum, the mini-phase generator),
      # src/ (LinkDriver.scala), build/ (the scripts, build/pgo, the sysroot data 06-package.sh vendors, and
      # ci-state.sh, whose format the tarball has) and the toolchain setup action. Left out, because the core scripts
      # never read them: the dotc/lsp-stage scripts (03*, 04d, 07, 08*, lsp-*), buildinfo-lib.sh and 13-*.
      # Two things no file hash can see are covered by hand: the week stamp bounds drift of the runner image and of
      # unpinned apt packages (clang) to a week, and `v1` is bumped to force a rebuild. The tarball is ~800 MB per
      # target; GitHub evicts the least recently used entries beyond 10 GB, which only costs a rebuild.
      - name: Week stamp for the core cache key
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore core's build state
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/state.tgz
          key: scalino-core-state-v1-${{ matrix.target }}-${{ steps.week.outputs.week }}-${{ hashFiles('build/**', '!build/03*', '!build/04d-*', '!build/07-*', '!build/08*', '!build/lsp-*', '!build/buildinfo-lib.sh', '!build/13-*', 'patches/**', 'versions.env', 'src/**', 'tools/**', '.github/actions/setup-build-deps/**') }}

      - uses: ./.github/actions/setup-build-deps
        if: steps.core-cache.outputs.cache-hit != 'true'

      - uses: ./.github/actions/memory-watchdog
        if: steps.core-cache.outputs.cache-hit != 'true'

      # Scala Native, built from source with our patches (01a), takes ~8 min on
      # macOS and only changes with the patches and the pinned commit, so keep
      # what it publishes to ~/.ivy2/local.
      - name: Cache patched scala-native libs
        id: sn-cache
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/local/org.scala-native
          key: scalino-sn-published-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('patches/scala-native-*.patch', 'versions.env', 'build/01a-publish-scala-native.sh') }}

      - name: Build toolchain (core)
        if: steps.core-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SCALINO_REUSE_PUBLISHED: ${{ steps.sn-cache.outputs.cache-hit == 'true' && '1' || '' }}
        run: ./build/all.sh core

      - name: Memory log
        if: always() && runner.os == 'Linux' && steps.core-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          tail -40 "$RUNNER_TEMP/mem.log" || true
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -10 || true

      - name: Save build state
        if: steps.core-cache.outputs.cache-hit != 'true'
        shell: bash
        run: ./build/ci-state.sh save "$RUNNER_TEMP/state.tgz"

      - name: Cache core's build state
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/state.tgz
          key: ${{ steps.core-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.target }}
          path: ${{ runner.temp }}/state.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  lsp:
    name: lsp (${{ matrix.target }})
    needs: [plan, core]
    runs-on: ${{ matrix.os }}
    env:
      # Single link/codegen/clang worker: parallel clang on the 2-core runners
      # (plus the JVM heap) OOM-killed the runner. patch scala-native-0070.
      SCALANATIVE_LINK_THREADS: '1'
      SCALINO_LINK_RAM_PERCENT: ${{ startsWith(matrix.target, 'linux') && '55' || '80' }}
      # Link with LinkDriver on a JVM (build/link-lib.sh): the native linkdriver
      # needs ~25 min and several GB more per link.
      SCALINO_JVM_LINK: '1'
      # build/00-env.sh defaults linux-x86_64 to thin LTO; CI only checks the
      # build works, so skip it (links stay in debug mode, release.yml opts in).
      SCALINO_LINK_LTO: none
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-deps

      - uses: ./.github/actions/memory-watchdog

      - uses: actions/download-artifact@v4
        with:
          name: state-${{ matrix.target }}
          path: ${{ runner.temp }}

      - name: Restore build state
        shell: bash
        run: ./build/ci-state.sh restore "$RUNNER_TEMP/state.tgz"

      - name: Build scalino-lsp
        shell: bash
        run: ./build/all.sh lsp

      - name: Memory log
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          tail -40 "$RUNNER_TEMP/mem.log" || true
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -10 || true

      # Cross-linked for Windows by the `windows-lsp` job, which has the scalino CLI (sysroots) this job lacks.
      - name: Package the LSP's NIR for the Windows cross-link
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          # lsp-link.cp itself plus every entry on it: the dependency jars (jsoniter, java.time, ...) are fetched by
          # this job, so core's saved state does not have them
          cp_file=.build-work/selfhost/lsp-link.cp
          { echo "${PWD#/}/$cp_file"; tr ':' '\n' < "$cp_file" | sed 's|^/||'; } > "$RUNNER_TEMP/lsp-nir.list"
          tar -C / -czf "$RUNNER_TEMP/lsp-nir.tgz" -T "$RUNNER_TEMP/lsp-nir.list"

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux-x86_64'
        with:
          name: lsp-nir
          path: ${{ runner.temp }}/lsp-nir.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      # tar, not a bare path: artifact upload drops the executable bit.
      - name: Package scalino-lsp
        shell: bash
        run: tar -C dist -czf "$RUNNER_TEMP/scalino-lsp.tgz" scalino-lsp

      - uses: actions/upload-artifact@v4
        with:
          name: lsp-${{ matrix.target }}
          path: ${{ runner.temp }}/scalino-lsp.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  dotc:
    name: build (${{ matrix.target }})
    needs: [plan, core]
    runs-on: ${{ matrix.os }}
    env:
      # Single link/codegen/clang worker: parallel clang on the 2-core runners
      # (plus the JVM heap) OOM-killed the runner. patch scala-native-0070.
      SCALANATIVE_LINK_THREADS: '1'
      SCALINO_LINK_RAM_PERCENT: ${{ startsWith(matrix.target, 'linux') && '55' || '80' }}
      # Link with LinkDriver on a JVM (build/link-lib.sh): the native linkdriver
      # needs ~25 min and several GB more per link.
      SCALINO_JVM_LINK: '1'
      # build/00-env.sh defaults linux-x86_64 to thin LTO; CI only checks the
      # build works, so skip it (links stay in debug mode, release.yml opts in).
      SCALINO_LINK_LTO: none
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-deps

      - uses: ./.github/actions/memory-watchdog

      - uses: actions/download-artifact@v4
        with:
          name: state-${{ matrix.target }}
          path: ${{ runner.temp }}

      - name: Restore build state
        shell: bash
        run: ./build/ci-state.sh restore "$RUNNER_TEMP/state.tgz"

      - name: Build toolchain (scalino-dotc, scalino)
        shell: bash
        run: ./build/all.sh dotc

      - name: Memory log
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          tail -40 "$RUNNER_TEMP/mem.log" || true
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -10 || true

      # Taken before the smoke tests so it is the freshly built dist/. tar,
      # not a bare path: artifact upload drops the executable bit.
      - name: Package dist
        shell: bash
        run: tar -C dist -czf "$RUNNER_TEMP/dist.tgz" .

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: ${{ runner.temp }}/dist.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      # The Windows toolchain is cross-linked here, from this job's NIR (build/13-cross-link-toolchain.sh), and run
      # for real by the `windows` job below. Only on linux-x86_64: one host is enough, and it has the matching state.
      - name: Cross-link the toolchain for Windows (x86_64, arm64)
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          # the mingw sysroot's libc++ needs clang >= 21; the toolchain build above uses LLVM 20
          wget -O /tmp/llvm22.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm22.sh 22
          export PATH="/usr/lib/llvm-22/bin:$PATH"
          for arch in x86_64 aarch64; do
            SCALINO_WINDOWS_PDB=1 ./build/13-cross-link-toolchain.sh "$arch-pc-windows-gnu" dotc linkdriver jslink cli
            tar -C "dist-cross/$arch-pc-windows-gnu" -czf "$RUNNER_TEMP/windows-$arch.tgz" .
          done

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux-x86_64'
        with:
          name: windows-dist
          path: |
            ${{ runner.temp }}/windows-x86_64.tgz
            ${{ runner.temp }}/windows-aarch64.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Smoke test -- plain program
        shell: bash
        run: |
          out="$(./dist/scalino run examples/Hello.scala)"
          echo "$out"
          [[ "$out" == *"hello"* || "$out" == *"Hello"* ]] || { echo "unexpected output"; exit 1; }

      - name: Smoke test -- Lower cache (SCALINO_LOWER_CACHE)
        # Edit sequence under `package -w`, binary compared with a fresh uncached link after every
        # step, in verify mode and in plain mode. See tests/lower-cache/run.sh.
        shell: bash
        run: ./tests/lower-cache/run.sh dist/scalino

      - name: Smoke test -- libraries built with Scala Native 0.5.12
        # snunit 0.13.0 from Maven Central references posixlib externs by their 0.5.12 link names.
        # See tests/native-compat/run.sh.
        shell: bash
        run: ./tests/native-compat/run.sh dist/scalino

      - name: Smoke test -- real macro
        # Known-failing, not a regression: jsoniter-scala's derivation macro hits an open
        # interpreter gap (general quote-pattern matching; docs/findings.md "Remaining work" #1).
        # Kept as a regression canary: continue-on-error shows a new or fixed failure in the log.
        continue-on-error: true
        shell: bash
        run: ./dist/scalino run examples/macro-hello/Test.scala examples/macro-hello/Foo.scala

      - name: Smoke test -- interpreter bug-fix regressions
        shell: bash
        run: ./dist/scalino run examples/interpreter-regressions/Test.scala examples/interpreter-regressions/Foo.scala

      - name: Smoke test -- dist/ is relocatable (flat, like a release tarball)
        shell: bash
        run: |
          # Mirrors release.yml's packaging: dist/'s *contents* copied flat
          # into an arbitrarily-named directory (no "dist/" wrapper) --
          # scalino must locate its own lib/, compiler.cp etc. as siblings of
          # itself, not by assuming a directory literally named "dist".
          pkg="$(mktemp -d)/scalino-smoketest"
          mkdir -p "$pkg"
          cp -a dist/. "$pkg/"
          workdir="$(mktemp -d)"
          cp examples/Hello.scala "$workdir/Hello.scala"
          ( cd "$workdir" && "$pkg/scalino" run Hello.scala )

  # The heavy smoke tests run on their own runners, in parallel, from the dist
  # artifact the dotc job uploads (they were 10-20 min of that job's tail).
  smoke:
    name: smoke ${{ matrix.test }} (${{ matrix.target }})
    needs: [plan, dotc]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.smoke) }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-deps

      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: ${{ runner.temp }}

      - name: Unpack dist
        shell: bash
        run: |
          mkdir -p dist
          tar -C dist -xzf "$RUNNER_TEMP/dist.tgz"

      - name: Smoke test -- Scala.js
        if: matrix.test == 'js'
        # No JVM anywhere: dotc -scalajs, scalino-jslink, node. Program arguments, optimized ES module
        # packaging, Scala.js dependencies, `scalino test` on node, `run -w` and the client/server
        # example. See tests/js/run.sh.
        shell: bash
        run: ./tests/js/run.sh dist/scalino

      - name: Smoke test -- stack-allocated objects (escape analysis)
        if: matrix.test == 'escape'
        # Every release mode stack-allocates objects the escape analysis
        # proves non-escaping. SCALANATIVE_STACK_POISON overwrites a frame's
        # stack objects when it is left, so a wrong analysis crashes
        # deterministically instead of reading dead-but-intact stack memory.
        shell: bash
        run: |
          for mode in release-fast release-full; do
            ./dist/scalino clean   # earlier steps leave other entry points in .scalino-build
            out="$(SCALANATIVE_STACK_POISON=1 ./dist/scalino run examples/escape-analysis/Main.scala --main-class Main --native-mode "$mode")"
            echo "$mode: $out"
            [[ "$out" == *"sum=1412"* ]] || { echo "unexpected output"; exit 1; }
          done

      - name: Smoke test -- GC safepoint trampoline (patch 0069)
        if: matrix.test == 'trampoline'
        # A thread stopped at a GC yield point must resume with every register,
        # the flags and the x86_64 red zone intact. The unit test checks the
        # trampoline directly (Linux x86_64 only); the example checks it end to
        # end: leaf loops that spill into the red zone while another thread
        # forces GCs.
        shell: bash
        run: |
          # the unit test compiles the trampoline sources from the patched vendor tree
          VENDOR_ONLY=scala-native ./build/00b-setup-vendor.sh
          tests/safepoint-trampoline/run.sh
          ./dist/scalino clean
          # tee: show the program's output even when it fails (a bare $(...) hides it)
          ./dist/scalino run examples/safepoint-trampoline/Main.scala --main-class Main --native-mode release-fast | tee safepoint-trampoline.out
          grep -q "safepoint-trampoline: ok" safepoint-trampoline.out || { echo "unexpected output"; exit 1; }

      # Same flow as the scalino-example release workflow: one Linux host
      # cross-builds an app for every supported target, using the scalino
      # just built from this commit (so cross-compilation is tested before a
      # release, not by it).
      - name: Cache cross-compilation sysroots
        if: matrix.test == 'cross'
        uses: actions/cache@v4
        with:
          path: ~/.cache/scalino/sysroots
          key: scalino-sysroots-${{ hashFiles('versions.env', 'cli/SysrootBuild.scala') }}

      - name: Cross-build -- every target from Linux
        if: matrix.test == 'cross'
        shell: bash
        run: |
          triples=(
            x86_64-unknown-linux-musl aarch64-unknown-linux-musl
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
            x86_64-apple-darwin aarch64-apple-darwin
            x86_64-pc-windows-gnu aarch64-pc-windows-gnu
          )
          command -v ld.lld  # needed for the macOS and Windows targets
          ./dist/scalino sysroot build "${triples[@]}"
          rm -rf cross-out
          # The Windows sysroot's libc++ needs clang >= 21; the toolchain
          # build above pins LLVM 20, so install a newer clang just for this.
          wget -O /tmp/llvm22.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm22.sh 22
          ./dist/scalino package examples/Hello.scala --native-mode release-fast \
            --native-clang /usr/lib/llvm-22/bin/clang --native-clangpp /usr/lib/llvm-22/bin/clang++ \
            --native-target-triple "$(IFS=,; echo "${triples[*]}")" \
            -o cross-out/hello
          ls -l cross-out
          check() { # <file> <pattern in `file` output>
            f="cross-out/$1"
            [[ -f "$f" ]] || { echo "missing $f"; exit 1; }
            desc="$(file "$f")"; echo "$desc"
            [[ "$desc" =~ $2 ]] || { echo "wrong format for $f"; exit 1; }
          }
          check hello-x86_64-unknown-linux-musl  'ELF 64-bit.*x86-64'
          check hello-aarch64-unknown-linux-musl 'ELF 64-bit.*aarch64'
          check hello-x86_64-unknown-linux-gnu   'ELF 64-bit.*x86-64'
          check hello-aarch64-unknown-linux-gnu  'ELF 64-bit.*aarch64'
          check hello-x86_64-apple-darwin        'Mach-O 64-bit.*x86_64'
          check hello-aarch64-apple-darwin       'Mach-O 64-bit.*arm64'
          check hello-x86_64-pc-windows-gnu.exe  'PE32\+.*x86-64'
          check hello-aarch64-pc-windows-gnu.exe 'PE32\+.*Aarch64'
          # The runner is x86_64 Linux: the two x86_64 Linux binaries must run.
          for t in musl gnu; do
            out="$(cross-out/hello-x86_64-unknown-linux-$t)"
            echo "$t: $out"
            [[ "$out" == *"ello"* ]] || { echo "unexpected output from $t binary"; exit 1; }
          done
          # java.util.zip needs zlib in the Linux sysroots (tests/cross/Zip.scala): Hello above never links it
          ./dist/scalino package tests/cross/Zip.scala --native-mode release-fast \
            --native-target-triple x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu \
            -o cross-out/zip
          for t in musl gnu; do
            out="$(cross-out/zip-x86_64-unknown-linux-$t)"
            echo "$t: $out"
            [[ "$out" == *"zip ok"* ]] || { echo "unexpected output from the $t zip binary"; exit 1; }
          done
          check zip-aarch64-unknown-linux-musl 'ELF 64-bit.*aarch64'
          check zip-aarch64-unknown-linux-gnu  'ELF 64-bit.*aarch64'

  # scalino-lsp for Windows: needs the LSP's NIR (lsp job) and the scalino CLI that builds the mingw sysroots (dotc job).
  windows-lsp:
    name: windows-lsp
    needs: [dotc, lsp]
    runs-on: ubuntu-24.04
    env:
      SCALANATIVE_LINK_THREADS: '1'
      SCALINO_LINK_RAM_PERCENT: '55'
      SCALINO_JVM_LINK: '1'
      SCALINO_LINK_LTO: none
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-deps

      - uses: ./.github/actions/memory-watchdog

      - uses: actions/download-artifact@v4
        with:
          name: state-linux-x86_64
          path: ${{ runner.temp }}

      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-x86_64
          path: ${{ runner.temp }}

      - uses: actions/download-artifact@v4
        with:
          name: lsp-nir
          path: ${{ runner.temp }}

      - name: Assemble state
        shell: bash
        run: |
          ./build/ci-state.sh restore "$RUNNER_TEMP/state.tgz"
          tar -C dist -xzf "$RUNNER_TEMP/dist.tgz"
          tar -C / -xzf "$RUNNER_TEMP/lsp-nir.tgz"

      - name: Cross-link scalino-lsp for Windows (x86_64, arm64)
        shell: bash
        run: |
          wget -O /tmp/llvm22.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm22.sh 22
          export PATH="/usr/lib/llvm-22/bin:$PATH"
          for arch in x86_64 aarch64; do
            SCALINO_CROSS_PROGRAMS_ONLY=1 SCALINO_WINDOWS_PDB=1 ./build/13-cross-link-toolchain.sh "$arch-pc-windows-gnu" lsp
            mkdir -p "lsp-win-$arch"
            cp ".build-work/cross/$arch-pc-windows-gnu/lsp.bin" "lsp-win-$arch/scalino-lsp.exe"
            [[ ! -f ".build-work/cross/$arch-pc-windows-gnu/lsp.pdb" ]] || cp ".build-work/cross/$arch-pc-windows-gnu/lsp.pdb" "lsp-win-$arch/"
            tar -C "lsp-win-$arch" -czf "$RUNNER_TEMP/windows-lsp-$arch.tgz" .
          done

      - uses: actions/upload-artifact@v4
        with:
          name: windows-lsp
          path: |
            ${{ runner.temp }}/windows-lsp-x86_64.tgz
            ${{ runner.temp }}/windows-lsp-aarch64.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # The toolchain cross-linked above, run on real Windows: x86_64 on windows-latest, arm64 on windows-11-arm.
  # Nothing here builds scalino itself; the first build downloads llvm-mingw's clang and assembles the sysroot.
  windows:
    name: windows (${{ matrix.arch }})
    needs: [dotc, windows-lsp]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, os: windows-latest}
          - {arch: aarch64, os: windows-11-arm}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: ${{ runner.temp }}/win
          merge-multiple: true

      - name: Assemble dist
        shell: bash
        run: |
          # RUNNER_TEMP is D:\a\_temp: bash mangles the backslashes and tar reads `D:` as a remote host
          t="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$t/scalino"
          tar -C "$t/scalino" -xzf "$t/win/windows-${{ matrix.arch }}.tgz"
          tar -C "$t/scalino" -xzf "$t/win/windows-lsp-${{ matrix.arch }}.tgz"
          echo "$RUNNER_TEMP\\scalino" >> "$GITHUB_PATH"
          echo "_NT_SYMBOL_PATH=$RUNNER_TEMP\\scalino" >> "$GITHUB_ENV"

      - name: Cache sysroots and the C toolchain
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\scalino\sysroots
          key: scalino-windows-sysroots-${{ matrix.arch }}-${{ hashFiles('versions.env', 'cli/SysrootBuild.scala') }}

      - name: Smoke test -- version
        shell: bash
        run: scalino --version

      - name: Smoke test -- plain program
        shell: bash
        run: |
          out="$(scalino run examples/Hello.scala)"
          echo "$out"
          [[ "$out" == *"hello"* || "$out" == *"Hello"* ]] || { echo "unexpected output"; exit 1; }

      - name: Smoke test -- dependency (coursier)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cat > Dep.scala <<'EOF'
          //> using dep com.lihaoyi::os-lib::0.11.3
          @main def dep() = println(os.pwd.last.nonEmpty)
          EOF
          out="$(scalino run Dep.scala)"
          echo "$out"
          [[ "$out" == *true* ]]

      - name: Smoke test -- package a binary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          scalino package examples/Hello.scala -o hello
          ./hello.exe

      - name: Smoke test -- test framework
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p t && cd t
          cat > T.test.scala <<'EOF'
          //> using test.dep "org.scalameta::munit::1.0.2"
          class T extends munit.FunSuite:
            test("one") { assertEquals(1 + 1, 2) }
          EOF
          scalino test .

      - name: Smoke test -- release-fast mode
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          out="$(scalino run --native-mode release-fast examples/Hello.scala)"
          echo "$out"
          [[ "$out" == *"hello"* || "$out" == *"Hello"* ]]

      - name: Smoke test -- scalino-lsp
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          (cd build/lsp-trace-fixture && scalino setup-ide Model.scala Greeter.scala Main.scala)
          python build/lsp-trace-drive.py "$PWD/build/lsp-trace-fixture" "$(command -v scalino-lsp)" -stdio

      - name: Smoke test -- Scala.js
        if: ${{ !cancelled() }}
        shell: bash
        run: ./tests/js/run.sh "$(command -v scalino)"

  # scalino-lsp's smoke test drives it through `dist/scalino setup-ide`, so it
  # can only run once both the lsp and dotc jobs are done.
  finish:
    name: finish (${{ matrix.target }})
    needs: [plan, dotc, lsp]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-deps

      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: ${{ runner.temp }}

      - uses: actions/download-artifact@v4
        with:
          name: lsp-${{ matrix.target }}
          path: ${{ runner.temp }}

      - name: Assemble dist
        shell: bash
        run: |
          mkdir -p dist
          tar -C dist -xzf "$RUNNER_TEMP/dist.tgz"
          tar -C dist -xzf "$RUNNER_TEMP/scalino-lsp.tgz"

      - name: Smoke test -- scalino-lsp
        shell: bash
        run: ./build/08b-smoke-lsp.sh
