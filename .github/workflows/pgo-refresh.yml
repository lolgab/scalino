name: Refresh PGO profiles

# Regenerates pgo/<name>.jvm.{llvm,interflow}.gz, the profiles of the JVM-linked
# scalino-dotc and scalino-lsp (SCALINO_JVM_LINK=1, see build/link-lib.sh and
# docs/pgo.md), with the very toolchain, clang and link settings CI and the
# release use, and opens a PR with them. Run it after changes that move a lot
# of code, before tagging a release.
#
# The linkdriver profile (native, direct codegen) is not refreshed here: it is
# taken with build/pgo/refresh-profiles.sh linkdriver on a developer machine.
on:
  workflow_dispatch:
    inputs:
      names:
        description: 'Profiles to refresh (JSON array)'
        default: '["dotc","lsp"]'
      lsp_runs:
        description: 'LSP training sessions'
        default: '1'

permissions:
  contents: write
  pull-requests: write

jobs:
  profile:
    name: profile (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.names) }}
    env:
      SCALANATIVE_LINK_THREADS: '1'
      SCALINO_LINK_RAM_PERCENT: '55'
      SCALINO_LINK_MODE: release-fast
      SCALINO_JVM_LINK: '1'
      # the base build must not use the profiles that are being replaced
      SCALINO_PGO: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-deps

      - uses: ./.github/actions/memory-watchdog

      - name: Build toolchain (core)
        run: ./build/all.sh core

      # dotc: the NIR the pgo scripts link, and dist/scalino for the LSP workload
      - name: Build scalino-dotc and the CLI
        run: ./build/all.sh dotc

      - name: Build scalino-lsp
        if: matrix.name == 'lsp'
        run: ./build/all.sh lsp

      - name: Profile ${{ matrix.name }}
        env:
          SCALINO_PGO: '1'
          # the profiles are packed by this run; the final link only verifies them
          SKIP_FINAL: '1'
          LSP_RUNS: ${{ inputs.lsp_runs }}
        run: ./build/pgo/pgo-${{ matrix.name }}.sh

      - name: Link logs
        if: always()
        run: tail -n 15 .build-work/pgo-${{ matrix.name }}/*.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: pgo-${{ matrix.name }}
          path: pgo/${{ matrix.name }}.jvm.*.gz
          if-no-files-found: error

  pull-request:
    needs: profile
    if: ${{ !cancelled() && needs.profile.result != 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pgo-*
          path: pgo-new

      - name: Collect
        run: cp pgo-new/*/*.gz pgo/ && rm -rf pgo-new && ls -l pgo

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: pgo-refresh
          commit-message: 'pgo: refresh the JVM link profiles'
          title: 'pgo: refresh the JVM link profiles'
          body: |
            Regenerated by the `Refresh PGO profiles` workflow
            (run ${{ github.run_id }}) on ubuntu-24.04 with `SCALINO_JVM_LINK=1`.
          add-paths: pgo/*.jvm.*.gz
