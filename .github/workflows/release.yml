name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build+release (defaults to the triggering tag)'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-x86_64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-deps

      - name: Build toolchain
        shell: bash
        run: ./build/all.sh

      - name: Smoke test -- plain program
        shell: bash
        run: ./dist/scalino run examples/Hello.scala

      - name: Smoke test -- real macro
        # Known-failing, not a regression: see ci.yml's identical step for
        # the full explanation (jsoniter-scala's derivation macro hits a
        # genuine, still-open interpreter gap -- docs/findings.md's
        # "Remaining work" #1). Without continue-on-error here, this step's
        # failure skipped every later step in the job (Package included),
        # so a release build that actually succeeded still shipped zero
        # assets for every platform.
        continue-on-error: true
        shell: bash
        run: ./dist/scalino run examples/macro-hello/Test.scala examples/macro-hello/Foo.scala

      - name: Package
        shell: bash
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          pkg="scalino-${version}-${{ matrix.target }}"
          mkdir -p "out/$pkg"
          cp -a dist/. "out/$pkg/"
          cp README.md LICENSE NOTICE "out/$pkg/"
          mkdir -p assets
          tar czf "assets/$pkg.tar.gz" -C out "$pkg"
          ( cd assets && (sha256sum "$pkg.tar.gz" 2>/dev/null || shasum -a 256 "$pkg.tar.gz") > "$pkg.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            assets/*.tar.gz
            assets/*.tar.gz.sha256
          if-no-files-found: error

      # .deb/.rpm are an alternative to the tarball for apt/dnf users --
      # native package manager install (clang pulled in as a real dependency)
      # instead of tarball+install.sh. Linux only: fpm's rpm backend shells
      # out to rpmbuild, which isn't installed/tested on the macOS/Windows
      # legs here.
      - name: Package .deb/.rpm (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rpm
          sudo gem install --no-document fpm
          case "${{ matrix.target }}" in
            linux-x86_64) deb_arch=amd64; rpm_arch=x86_64 ;;
            linux-arm64)  deb_arch=arm64; rpm_arch=aarch64 ;;
          esac
          tag="${{ inputs.tag || github.ref_name }}"
          ./build/09-package-linux-native.sh "$tag" "$deb_arch" "$rpm_arch"
          ( cd assets && for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done )

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: dist-${{ matrix.target }}-native-pkgs
          path: |
            assets/*.deb
            assets/*.deb.sha256
            assets/*.rpm
            assets/*.rpm.sha256
          if-no-files-found: error

  # Cross-compilation sysroots (`scalino sysroot fetch <triple>`): musl +
  # compiler-rt per Linux target (cross-built with clang), libSystem stubs +
  # Darwin headers per macOS target; one runner makes every one. Independent of the toolchain build above.
  sysroots:
    name: sysroot (${{ matrix.triple }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        triple:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-gnu
          - aarch64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update -y && sudo apt-get install -y clang lld llvm cmake ninja-build make curl binutils xz-utils

      - name: Build sysroot
        run: ./build/12-build-sysroot.sh ${{ matrix.triple }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sysroot-${{ matrix.triple }}
          path: |
            dist/sysroot-packages/*.tar.gz
            dist/sysroot-packages/*.tar.gz.sha256
          if-no-files-found: error

  # Windows x86_64 release build disabled -- see docs/findings.md.
  # build-windows:
  #   name: build (windows-x86_64)
  #   runs-on: windows-latest
  #   # Windows x86_64 support is untested/experimental -- see docs/findings.md.
  #   # Not a release gate: publish depends only on the Linux/macOS build job
  #   # below, so a broken Windows leg never blocks the release.
  #   continue-on-error: true
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: ./.github/actions/setup-build-deps
  #
  #     - name: Build toolchain
  #       shell: bash
  #       run: ./build/all.sh
  #
  #     - name: Smoke test -- plain program
  #       shell: bash
  #       run: ./dist/scalino run examples/Hello.scala
  #
  #     - name: Smoke test -- real macro
  #       # Known-failing, not a regression: see ci.yml's identical step for
  #       # the full explanation (jsoniter-scala's derivation macro hits a
  #       # genuine, still-open interpreter gap -- docs/findings.md's
  #       # "Remaining work" #1). Without continue-on-error here, this step's
  #       # failure skipped every later step in the job (Package included),
  #       # so a release build that actually succeeded still shipped zero
  #       # assets for every platform.
  #       continue-on-error: true
  #       shell: bash
  #       run: ./dist/scalino run examples/macro-hello/Test.scala examples/macro-hello/Foo.scala
  #
  #     - name: Package
  #       shell: bash
  #       run: |
  #         version="${{ inputs.tag || github.ref_name }}"
  #         pkg="scalino-${version}-windows-x86_64"
  #         mkdir -p "out/$pkg"
  #         cp -a dist/. "out/$pkg/"
  #         cp README.md LICENSE NOTICE "out/$pkg/"
  #         mkdir -p assets
  #         tar czf "assets/$pkg.tar.gz" -C out "$pkg"
  #         ( cd assets && (sha256sum "$pkg.tar.gz" 2>/dev/null || shasum -a 256 "$pkg.tar.gz") > "$pkg.tar.gz.sha256" )
  #
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: dist-windows-x86_64
  #         path: |
  #           assets/*.tar.gz
  #           assets/*.tar.gz.sha256
  #         if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build, sysroots]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: assets
          merge-multiple: true

      - name: List assets that actually built
        run: ls -la assets || echo "no assets produced -- every platform failed"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            assets/*.tar.gz
            assets/*.tar.gz.sha256
            assets/*.deb
            assets/*.deb.sha256
            assets/*.rpm
            assets/*.rpm.sha256

  update-package-metadata:
    name: Update packaging metadata (homebrew/arch/nix)
    needs: publish
    runs-on: ubuntu-24.04
    # Best-effort: build/10-update-package-metadata.sh curls all 4 platform
    # tarballs from the release it just downloaded/uploaded. If one platform's
    # build job failed above (they're continue-on-error, see the comment on
    # the build job), that asset is missing from the release and this script
    # fails fetching it -- a maintainer then reruns it locally once the
    # missing platform is fixed. Must not block the release itself.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update version+sha256 in PKGBUILD/sources.json/homebrew formula
        run: ./build/10-update-package-metadata.sh "${{ inputs.tag || github.ref_name }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/arch/PKGBUILD packaging/nix/sources.json packaging/homebrew/scalino.rb
          if git diff --cached --quiet; then
            echo "No packaging metadata changes -- skipping commit"
            exit 0
          fi
          git commit -m "packaging: update metadata for ${{ inputs.tag || github.ref_name }}"
          git push origin HEAD:main

  publish-repo:
    name: Publish apt/dnf repo
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install repo-building tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gnupg dpkg-dev apt-utils createrepo-c rpm

      - name: Build apt/dnf repo tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: ./build/11-build-apt-dnf-repo.sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
