name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build+release (defaults to the triggering tag)'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      # Single link/codegen/clang worker: parallel clang on the 2-core runners
      # (plus the JVM heap) OOM-killed the runner. patch scala-native-0070.
      SCALANATIVE_LINK_THREADS: '1'
      # Tag builds ship optimized binaries; everything else links in debug mode.
      SCALINO_LINK_MODE: release-fast
      # JVM heap for the JVM links: 80% of the 16 GB Linux runners got the runner
      # killed, the macOS ones have less RAM and need the full 80%.
      SCALINO_LINK_RAM_PERCENT: ${{ startsWith(matrix.target, 'linux') && '55' || '80' }}
      # Link scalino-dotc/scalino-lsp/the CLI with LinkDriver on a JVM instead
      # of the native scalino-linkdriver (build/link-lib.sh): a third of the
      # time and far less memory, which is what makes the 7GB macos-arm64 runner
      # work. The JVM link has its own PGO profiles (pgo/*.jvm.*, docs/pgo.md).
      SCALINO_JVM_LINK: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-x86_64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-deps

      - name: Build toolchain
        shell: bash
        run: ./build/all.sh

      - name: Smoke test -- plain program
        shell: bash
        run: ./dist/scalino run examples/Hello.scala

      - name: Smoke test -- Scala.js
        # See ci.yml's identical step. A failure here must not keep the release from shipping
        # assets either (same reasoning as the macro step below), but it shows in the log.
        continue-on-error: true
        shell: bash
        run: ./tests/js/run.sh dist/scalino

      - name: Smoke test -- real macro
        # Known-failing, not a regression: see ci.yml. continue-on-error because a failure here
        # used to skip every later step (Package included) and ship no assets.
        continue-on-error: true
        shell: bash
        run: ./dist/scalino run examples/macro-hello/Test.scala examples/macro-hello/Foo.scala

      - name: Package
        shell: bash
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          pkg="scalino-${version}-${{ matrix.target }}"
          mkdir -p "out/$pkg"
          cp -a dist/. "out/$pkg/"
          cp README.md LICENSE NOTICE "out/$pkg/"
          mkdir -p assets
          tar czf "assets/$pkg.tar.gz" -C out "$pkg"
          ( cd assets && (sha256sum "$pkg.tar.gz" 2>/dev/null || shasum -a 256 "$pkg.tar.gz") > "$pkg.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            assets/*.tar.gz
            assets/*.tar.gz.sha256
          if-no-files-found: error

      - name: Cross-link the toolchain for Windows and zip it (Linux x86_64 leg only)
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          # the mingw sysroot's libc++ needs clang >= 21
          wget -O /tmp/llvm22.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm22.sh 22
          export PATH="/usr/lib/llvm-22/bin:$PATH"
          version="${{ inputs.tag || github.ref_name }}"
          mkdir -p assets
          for arch in x86_64 aarch64; do
            ./build/13-cross-link-toolchain.sh "$arch-pc-windows-gnu"
            winarch="$([[ "$arch" == aarch64 ]] && echo arm64 || echo "$arch")"
            pkg="scalino-${version}-windows-${winarch}"
            rm -rf "out/$pkg"; mkdir -p "out/$pkg"
            cp -a "dist-cross/$arch-pc-windows-gnu/." "out/$pkg/"
            cp README.md LICENSE NOTICE "out/$pkg/"
            ( cd out && zip -qr -9 "../assets/$pkg.zip" "$pkg" )
            ( cd assets && sha256sum "$pkg.zip" > "$pkg.zip.sha256" )
          done

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux-x86_64'
        with:
          name: dist-windows
          path: |
            assets/*.zip
            assets/*.zip.sha256
          if-no-files-found: error

      # .deb/.rpm for apt/dnf users (pulls in clang as a dependency) instead of tarball+install.sh.
      # Linux only: fpm's rpm backend needs rpmbuild, not installed on the macOS/Windows legs.
      - name: Package .deb/.rpm (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rpm
          sudo gem install --no-document fpm
          case "${{ matrix.target }}" in
            linux-x86_64) deb_arch=amd64; rpm_arch=x86_64 ;;
            linux-arm64)  deb_arch=arm64; rpm_arch=aarch64 ;;
          esac
          tag="${{ inputs.tag || github.ref_name }}"
          ./build/09-package-linux-native.sh "$tag" "$deb_arch" "$rpm_arch"
          ( cd assets && for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done )

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: dist-${{ matrix.target }}-native-pkgs
          path: |
            assets/*.deb
            assets/*.deb.sha256
            assets/*.rpm
            assets/*.rpm.sha256
          if-no-files-found: error

  # The Windows toolchain is cross-linked on the Linux x86_64 leg above (build/13-cross-link-toolchain.sh) and
  # run on real Windows here: x86_64 on windows-latest, arm64 on windows-11-arm. Not a release gate yet:
  # `publish` waits for it but ships whatever built.
  windows-smoke:
    name: windows smoke (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, os: windows-latest}
          - {arch: arm64, os: windows-11-arm}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: assets

      - name: Unpack
        shell: bash
        run: |
          # RUNNER_TEMP is D:\a\_temp: bash mangles the backslashes, so work in the POSIX form and hand GITHUB_PATH the Windows one
          t="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$t/unpacked"
          unzip -q assets/scalino-*-windows-${{ matrix.arch }}.zip -d "$t/unpacked"
          d="$(echo "$t"/unpacked/scalino-*-windows-${{ matrix.arch }})"
          cygpath -w "$d" >> "$GITHUB_PATH"

      - name: Smoke test -- plain program
        shell: bash
        run: |
          scalino --version
          out="$(scalino run examples/Hello.scala)"
          echo "$out"
          [[ "$out" == *"hello"* || "$out" == *"Hello"* ]] || { echo "unexpected output"; exit 1; }

  publish:
    name: Publish GitHub release
    needs: [build, windows-smoke]
    # ship whatever built: a Windows smoke failure does not hold the other platforms back
    if: ${{ !cancelled() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: assets
          merge-multiple: true

      - name: List assets that actually built
        run: ls -la assets || echo "no assets produced -- every platform failed"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            assets/*.tar.gz
            assets/*.tar.gz.sha256
            assets/*.zip
            assets/*.zip.sha256
            assets/*.deb
            assets/*.deb.sha256
            assets/*.rpm
            assets/*.rpm.sha256

  update-package-metadata:
    name: Update packaging metadata (homebrew/arch/nix)
    needs: publish
    runs-on: ubuntu-24.04
    # Best-effort: build/10-update-package-metadata.sh downloads all 4 platform tarballs, so it
    # fails when a (continue-on-error) build leg produced no asset; rerun it locally then.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update version+sha256 in PKGBUILD/sources.json/homebrew formula
        run: ./build/10-update-package-metadata.sh "${{ inputs.tag || github.ref_name }}"

      # Hashes of the archives `scalino sysroot build` downloads, for the
      # flake's offline cross-compilation (mkScalinoSysrootSources).
      # continue-on-error: a failure here must not block the PKGBUILD/sources.json/
      # homebrew update above; rerun build/12-update-nix-sysroot-hashes.sh locally.
      - uses: cachix/install-nix-action@v30
        continue-on-error: true

      - name: Update sysroot source hashes in sysroot-sources.json
        continue-on-error: true
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lld clang llvm xz-utils zstd
          ./build/12-update-nix-sysroot-hashes.sh "${{ inputs.tag || github.ref_name }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/arch/PKGBUILD packaging/nix/sources.json packaging/nix/sysroot-sources.json packaging/homebrew/scalino.rb
          if git diff --cached --quiet; then
            echo "No packaging metadata changes -- skipping commit"
            exit 0
          fi
          git commit -m "packaging: update metadata for ${{ inputs.tag || github.ref_name }}"
          git push origin HEAD:main

  publish-repo:
    name: Publish apt/dnf repo
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install repo-building tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gnupg dpkg-dev apt-utils createrepo-c rpm

      - name: Build apt/dnf repo tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: ./build/11-build-apt-dnf-repo.sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
